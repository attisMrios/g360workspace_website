<div style="max-width:500px;margin:auto;border-radius:10px;box-shadow:0 2px 8px #eee;font-family:'Poppins',Arial,sans-serif;background:#fff;">
  <div style="background:#f4f7f6;padding:24px 0 12px 0;text-align:center;border-radius:10px 10px 0 0;">
    <img src="https://www.g360co.com/assets/logo.png" alt="G360co Logo" style="height:60px;margin-bottom:10px;">
    <h2 style="color:#0056b3;margin:0;font-size:1.5rem;">Nuevo mensaje de contacto</h2>
    <p style="color:#888;margin:0;font-size:1rem;">Has recibido un nuevo mensaje desde tu landing page</p>
  </div>
  <div style="padding:24px;">
    <table style="width:100%;font-size:1rem;color:#2c3e50;">
      <tr>
        <td style="padding:8px 0;font-weight:600;width:120px;">Nombre:</td>
        <td style="padding:8px 0;">{{name}}</td>
      </tr>
      <tr>
        <td style="padding:8px 0;font-weight:600;">Correo:</td>
        <td style="padding:8px 0;">{{email}}</td>
      </tr>
      <tr>
        <td style="padding:8px 0;font-weight:600;">Teléfono:</td>
        <td style="padding:8px 0;">{{phone}}</td>
      </tr>
      <tr>
        <td style="padding:8px 0;font-weight:600;vertical-align:top;">Mensaje:</td>
        <td style="padding:8px 0;white-space:pre-line;">{{message}}</td>
      </tr>
    </table>
    <hr style="margin:24px 0 12px 0;border:none;border-top:1px solid #eee;">
    <div style="text-align:center;color:#888;font-size:0.95rem;">
      <p style="margin:0;">G360co Colombia<br>
      <a href="https://www.g360co.com" style="color:#007bff;text-decoration:none;">www.g360co.com</a></p>
    </div>
  </div>
</div>
